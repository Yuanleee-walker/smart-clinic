<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>就诊指南 - Smart Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #f8f9fa; max-width: 480px; margin: 0 auto; }
        .page-header { background: white; padding: 1rem 1.5rem; display: flex; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .back-btn { font-size: 1.25rem; color: #0d6efd; text-decoration: none; margin-right: 1rem; }
        .page-header h1 { font-size: 1.25rem; font-weight: 600; margin: 0; }
        .content { padding: 1.5rem; }
        .step-card { background: white; border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; align-items: flex-start; }
        .step-num { width: 36px; height: 36px; border-radius: 50%; background: #0d6efd; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1rem; flex-shrink: 0; margin-right: 1rem; }
        .step-content h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.25rem; }
        .step-content p { font-size: 0.85rem; color: #6c757d; margin: 0; }
        .tips { background: #e7f1ff; border-radius: 12px; padding: 1.25rem; margin-top: 1.5rem; }
        .tips h3 { font-size: 1rem; font-weight: 600; color: #0d6efd; margin-bottom: 0.75rem; }
        .tips ul { padding-left: 1.25rem; font-size: 0.85rem; color: #495057; }
        .tips li { margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div class="page-header">
        <a href="/patient" class="back-btn"><i class="bi bi-arrow-left"></i></a>
        <h1>就诊指南</h1>
    </div>
    <div class="content">
        <div class="step-card">
            <div class="step-num">1</div>
            <div class="step-content">
                <h3>预约挂号</h3>
                <p>选择医院、科室和医生，填写个人信息完成挂号</p>
            </div>
        </div>
        <div class="step-card">
            <div class="step-num">2</div>
            <div class="step-content">
                <h3>到达候诊</h3>
                <p>请在就诊时间前15分钟到达医院，在候诊区等待叫号</p>
            </div>
        </div>
        <div class="step-card">
            <div class="step-num">3</div>
            <div class="step-content">
                <h3>医生问诊</h3>
                <p>医生将为您进行详细问诊和检查，并提供诊疗方案</p>
            </div>
        </div>
        <div class="step-card">
            <div class="step-num">4</div>
            <div class="step-content">
                <h3>取药/检查</h3>
                <p>根据医生处方到药房取药，或前往相关科室做进一步检查</p>
            </div>
        </div>
        <div class="step-card">
            <div class="step-num">5</div>
            <div class="step-content">
                <h3>完成就诊</h3>
                <p>完成所有诊疗流程后即可离院，如有疑问可随时复诊</p>
            </div>
        </div>
        <div class="tips">
            <h3><i class="bi bi-lightbulb me-1"></i>就诊小贴士</h3>
            <ul>
                <li>请携带有效身份证件和医保卡</li>
                <li>如有既往病历、检查报告请一并带上</li>
                <li>就诊前可提前告知过敏史</li>
                <li>如有疑问可向导诊台咨询</li>
            </ul>
        </div>
    </div>
</body>
</html>
