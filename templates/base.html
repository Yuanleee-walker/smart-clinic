<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart Clinic{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-hospital me-2"></i>Smart Clinic</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link {% if request.endpoint in ['visit_list','new_visit','visit_detail']%}active{% endif %}" href="/visit"><i class="bi bi-clipboard2-pulse me-1"></i>门诊就诊</a></li>
                <li class="nav-item"><a class="nav-link {% if request.endpoint in ['patients','patient_history']%}active{% endif %}" href="/patients"><i class="bi bi-people me-1"></i>患者管理</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item"><span class="navbar-text text-white-50 me-3"><i class="bi bi-clock me-1"></i><span id="navbar-clock"></span></span></li>
                {% if session.user %}
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle text-white" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i>{{session.user}}
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/logout"><i class="bi bi-box-arrow-right me-2"></i>退出登录</a></li>
                    </ul>
                </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
<main class="container-fluid py-4 px-4">{% block content %}{% endblock %}</main>
<footer class="text-center text-muted py-3 border-top mt-4"><small>Smart Clinic v1.0 | 智能门诊医生工作站</small></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/main.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
