{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-lg border-0">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-hospital text-primary" style="font-size:3rem"></i>
                    <h4 class="mt-2">Smart Clinic</h4>
                    <p class="text-muted">智能门诊医生工作站</p>
                </div>
                {% if error %}
                <div class="alert alert-danger py-2"><i class="bi bi-exclamation-circle me-1"></i>{{error}}</div>
                {% endif %}
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="请输入用户名" required autofocus>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-3 py-2 fw-bold">
                        <i class="bi bi-box-arrow-in-right me-1"></i>登 录
                    </button>
                </form>
                <div class="text-center mt-4">
                    <small class="text-muted">演示账号：admin / admin123</small>
                    <div class="mt-3 pt-3 border-top">
                        <a href="/register" class="text-decoration-none small">
                            <i class="bi bi-phone me-1"></i>患者自助挂号入口 →
                        </a>
                    </div>
                </div>
            </div>
            <div class="card-footer text-center text-muted small py-3">
                Smart Clinic v1.0 | 医学信息工程专业项目
            </div>
        </div>
    </div>
</div>
{% endblock %}
