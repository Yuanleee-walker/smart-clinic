<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>患者服务 - Smart Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0d6efd;
            --primary-light: #e7f1ff;
            --success: #198754;
            --bg: #f8f9fa;
            --card: #ffffff;
            --text: #212529;
            --muted: #6c757d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem 1.5rem 3rem;
            text-align: center;
        }
        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .header p {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        /* Quick Actions */
        .quick-actions {
            margin: -2rem 1rem 1.5rem;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        .action-card {
            background: white;
            border-radius: 16px;
            padding: 1.5rem 1rem;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            text-decoration: none;
            color: var(--text);
            transition: transform 0.2s;
        }
        .action-card:active {
            transform: scale(0.95);
        }
        .action-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 0.75rem;
            font-size: 1.75rem;
        }
        .action-icon.primary { background: var(--primary-light); color: var(--primary); }
        .action-icon.success { background: #d1e7dd; color: var(--success); }
        .action-icon.warning { background: #fff3cd; color: #856404; }
        .action-icon.info { background: #cff4fc; color: #055160; }
        .action-card h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        .action-card p {
            font-size: 0.75rem;
            color: var(--muted);
            margin: 0;
        }

        /* Info Section */
        .info-section {
            margin: 0 1rem 1rem;
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .info-section h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
        }
        .info-section h2 i {
            color: var(--primary);
            margin-right: 0.5rem;
        }
        .info-list {
            list-style: none;
            padding: 0;
        }
        .info-list li {
            padding: 0.75rem 0;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
        }
        .info-list li:last-child {
            border-bottom: none;
        }
        .info-list i {
            color: var(--primary);
            margin-right: 0.75rem;
            font-size: 1.1rem;
        }
        .info-list .label {
            font-weight: 500;
            margin-right: auto;
        }
        .info-list .value {
            color: var(--muted);
            font-size: 0.9rem;
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 480px;
            margin: 0 auto;
            background: white;
            padding: 0.75rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--muted);
            box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
        }
        .doctor-link {
            display: inline-flex;
            align-items: center;
            color: var(--primary);
            text-decoration: none;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="bi bi-hospital"></i> Smart Clinic</h1>
        <p>智能门诊 · 便捷就医</p>
    </div>

    <div class="quick-actions">
        <a href="/patient/register" class="action-card">
            <div class="action-icon primary">
                <i class="bi bi-calendar-plus"></i>
            </div>
            <h3>预约挂号</h3>
            <p>在线挂号 快速就诊</p>
        </a>
        <a href="/patient/my-visits" class="action-card">
            <div class="action-icon success">
                <i class="bi bi-list-check"></i>
            </div>
            <h3>我的就诊</h3>
            <p>查看就诊记录</p>
        </a>
        <a href="/patient/guide" class="action-card">
            <div class="action-icon warning">
                <i class="bi bi-info-circle"></i>
            </div>
            <h3>就诊指南</h3>
            <p>就诊流程说明</p>
        </a>
        <a href="/patient/hospital" class="action-card">
            <div class="action-icon info">
                <i class="bi bi-hospital-fill"></i>
            </div>
            <h3>医院信息</h3>
            <p>科室与医生</p>
        </a>
    </div>

    <div class="info-section">
        <h2><i class="bi bi-clock-history"></i> 今日就诊</h2>
        <ul class="info-list">
            <li>
                <i class="bi bi-calendar-check"></i>
                <span class="label">今日接诊</span>
                <span class="value" id="todayVisits">-</span>
            </li>
            <li>
                <i class="bi bi-people"></i>
                <span class="label">当前候诊</span>
                <span class="value" id="waitingCount">-</span>
            </li>
            <li>
                <i class="bi bi-clock"></i>
                <span class="label">平均等待</span>
                <span class="value" id="avgWait">-</span>
            </li>
        </ul>
    </div>

    <div class="info-section">
        <h2><i class="bi bi-lightbulb"></i> 温馨提示</h2>
        <ul class="info-list">
            <li>
                <i class="bi bi-check-circle"></i>
                <span>请提前15分钟到达医院</span>
            </li>
            <li>
                <i class="bi bi-check-circle"></i>
                <span>携带身份证和医保卡</span>
            </li>
            <li>
                <i class="bi bi-check-circle"></i>
                <span>按挂号顺序就诊</span>
            </li>
        </ul>
    </div>

    <div class="footer">
        <div>Smart Clinic 患者服务 v1.0</div>
        <a href="/login" class="doctor-link">
            <i class="bi bi-person-badge me-1"></i>
            医生端入口
        </a>
    </div>

    <script>
        // 加载今日就诊数据
        fetch('/api/patient/today-stats')
            .then(r => r.json())
            .then(data => {
                document.getElementById('todayVisits').textContent = data.today_visits + ' 人';
                document.getElementById('waitingCount').textContent = data.waiting_count + ' 人';
                document.getElementById('avgWait').textContent = data.avg_wait_minutes + ' 分钟';
            })
            .catch(() => {
                document.getElementById('todayVisits').textContent = '0 人';
                document.getElementById('waitingCount').textContent = '0 人';
                document.getElementById('avgWait').textContent = '0 分钟';
            });
    </script>
</body>
</html>
