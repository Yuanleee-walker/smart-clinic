<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>医院信息 - Smart Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #f8f9fa; max-width: 480px; margin: 0 auto; }
        .page-header { background: white; padding: 1rem 1.5rem; display: flex; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .back-btn { font-size: 1.25rem; color: #0d6efd; text-decoration: none; margin-right: 1rem; }
        .page-header h1 { font-size: 1.25rem; font-weight: 600; margin: 0; }
        .content { padding: 1.5rem; }
        .hospital-card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 1.5rem; }
        .hospital-card h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; color: #0d6efd; }
        .hospital-card .info-row { display: flex; align-items: center; padding: 0.5rem 0; font-size: 0.9rem; }
        .hospital-card .info-row i { width: 20px; color: #0d6efd; margin-right: 0.75rem; }
        .dept-list { list-style: none; padding: 0; }
        .dept-list li { padding: 0.75rem 1rem; background: #f8f9fa; border-radius: 8px; margin-bottom: 0.5rem; font-size: 0.9rem; display: flex; align-items: center; }
        .dept-list li i { color: #0d6efd; margin-right: 0.75rem; }
    </style>
</head>
<body>
    <div class="page-header">
        <a href="/patient" class="back-btn"><i class="bi bi-arrow-left"></i></a>
        <h1>医院信息</h1>
    </div>
    <div class="content">
        <div class="hospital-card">
            <h2><i class="bi bi-hospital-fill me-2"></i>东方仁济医院</h2>
            <div class="info-row"><i class="bi bi-geo-alt"></i><span>东方市健康大道168号</span></div>
            <div class="info-row"><i class="bi bi-telephone"></i><span>021-8888-9999</span></div>
            <div class="info-row"><i class="bi bi-clock"></i><span>周一至周五 8:00-17:00</span></div>
        </div>
        <div class="hospital-card">
            <h2><i class="bi bi-grid-3x3-gap me-2"></i>科室介绍</h2>
            <ul class="dept-list">
                <li><i class="bi bi-activity"></i>全科门诊</li>
                <li><i class="bi bi-lungs"></i>呼吸内科</li>
                <li><i class="bi bi-heart-pulse"></i>心血管内科</li>
                <li><i class="bi bi-capsule"></i>消化内科</li>
                <li><i class="bi bi-droplet-half"></i>内分泌科</li>
                <li><i class="bi bi-lightning"></i>神经内科</li>
                <li><i class="bi bi-bandaid"></i>骨科</li>
                <li><i class="bi bi-ear"></i>耳鼻喉科</li>
                <li><i class="bi bi-eye"></i>眼科</li>
                <li><i class="bi bi-stars"></i>皮肤科</li>
                <li><i class="bi bi-droplet"></i>泌尿外科</li>
                <li><i class="bi bi-shield-check"></i>风湿免疫科</li>
                <li><i class="bi bi-droplet-fill"></i>血液科</li>
            </ul>
        </div>
    </div>
</body>
</html>
